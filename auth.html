<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121b24">
  <title>Authorizing | WHPD Citation Writer</title>
  <link rel="icon" type="image/png" href="https://whpd.space/images/whpd.png">
  <link rel="preconnect" href="https://whpd.space">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body class="theme-dark auth-page">
  <main class="auth-card">
    <img class="brand-mark brand-mark-large" src="https://whpd.space/images/whpd.png" alt="WHPD logo">
    <div class="eyebrow">EVE Online SSO</div>
    <h1 id="auth-title">Processing authorization</h1>
    <p id="auth-message">Verifying the callback and storing this character on your device.</p>
    <span class="auth-spinner" aria-hidden="true"></span>
    <a id="auth-return" class="button button-secondary" href="/" hidden>Return to the citation desk</a>
  </main>
</body>
</html>
